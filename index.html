<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiosk Test Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #007aff; }
        p { color: #333; font-size: 1.2rem; }
        .status-dot {
            height: 15px;
            width: 15px;
            background-color: #34c759;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="status-dot"></div>
        <h1>Kiosk Demo is Live</h1>
        <p>If you can see this on your iPad, GitHub Pages is working perfectly.</p>
        <p style="font-size: 0.9rem; color: #666;">URL: dcdenison.github.io/kiosk-demo/</p>
    </div>
</body>
</html>
